<app-admin-layout>
  <div class="p-4 max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Mon Profil</h1>

    <!-- Bloc d'erreur -->
    <div *ngIf="isError" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      <p>{{ errorMessage }}</p>
      <button class="btn bg-blue-600 text-white mt-2" (click)="cancel()">Retour au tableau de bord</button>
    </div>

    <div class="card shadow-sm p-6">
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">

        <!-- Nom complet -->
        <div class="mb-4">
          <label for="name" class="block font-semibold text-gray-700 mb-1">
            Nom complet <span class="text-red-500">*</span>
          </label>
          <input id="name" type="text" pInputText formControlName="name" class="w-full input-style" placeholder="Votre nom complet" />
          <small class="text-red-500" *ngIf="profileForm.get('name')?.invalid && profileForm.get('name')?.touched">
            Le nom est obligatoire (minimum 2 caractères).
          </small>
        </div>

        <!-- Email (non modifiable) -->
        <div class="mb-4">
          <label for="email" class="block font-semibold text-gray-700 mb-1">
            Email <span class="text-red-500">*</span>
          </label>
          <input id="email" type="email" pInputText formControlName="email" class="w-full input-style bg-gray-100 cursor-not-allowed" readonly />
          <small class="text-gray-500">L'adresse email ne peut pas être modifiée.</small>
        </div>

        <!-- Nouveau mot de passe -->
        <div class="mb-4">
          <label for="password" class="block font-semibold text-gray-700 mb-1">
            Nouveau mot de passe
          </label>
          <input id="password" type="password" pPassword formControlName="password" class="w-full input-style" placeholder="Laisser vide pour ne pas changer" />
          <small class="text-gray-500">Minimum 8 caractères.</small>
        </div>

        <!-- Confirmation du mot de passe -->
        <div class="mb-6">
          <label for="password_confirmation" class="block font-semibold text-gray-700 mb-1">
            Confirmer le mot de passe
          </label>
          <input id="password_confirmation" type="password" pInputText formControlName="password_confirmation" class="w-full input-style" placeholder="Confirmez le nouveau mot de passe" />
          <small class="text-red-500" *ngIf="profileForm.get('password_confirmation')?.invalid && profileForm.get('password_confirmation')?.touched">
            La confirmation est obligatoire si vous changez le mot de passe.
          </small>
        </div>

        <!-- Boutons -->
        <div class="flex gap-4">
          <button
            type="submit"
            class="btn bg-[var(--tw-main-blue)] text-white hover:bg-white hover:text-[var(--tw-main-blue)] outline outline-1 hover:outline-[var(--tw-main-blue)] transition-all duration-300 px-6 py-2"
            [disabled]="isLoading"
          >
            <i class="fas fa-spinner fa-spin" *ngIf="isLoading"></i>
            <i class="fas fa-save" *ngIf="!isLoading"></i>
            {{ isLoading ? 'Enregistrement...' : 'Enregistrer' }}
          </button>
          <button
            type="button"
            class="btn text-white bg-gray-600 hover:bg-white hover:text-gray-600 outline outline-1 hover:outline-gray-600 transition-all duration-300 px-6 py-2"
            (click)="cancel()"
          >
            <i class="fas fa-times mr-1"></i> Annuler
          </button>
        </div>
      </form>
    </div>
  </div>
</app-admin-layout>
