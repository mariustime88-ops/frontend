<div class="notif-bell-wrapper">

  <!-- Bell button -->
  <button class="notif-bell-btn" (click)="toggle()" [class.notif-bell-btn--open]="open" title="Notifications">
    <i class="fas fa-bell"></i>
    <span
      *ngIf="(counts$ | async)?.unread_count as cnt"
      class="notif-badge"
    >{{ cnt > 99 ? '99+' : cnt }}</span>
  </button>

  <!-- Dropdown -->
  <div class="notif-dropdown" *ngIf="open">
    <!-- Header -->
    <div class="notif-dropdown__header">
      <span class="notif-dropdown__title">
        Notifications
        <span class="notif-dropdown__count" *ngIf="(counts$ | async)?.unread_count as n">
          {{ n }} non lue{{ n > 1 ? 's' : '' }}
        </span>
      </span>
      <button class="notif-dropdown__mark-all" (click)="markAllRead()" title="Tout marquer comme lu">
        <i class="fas fa-check-double"></i>
      </button>
    </div>

    <!-- Loading -->
    <div class="notif-dropdown__loading" *ngIf="loading$ | async">
      <img src="assets/images/loader.gif" width="24" alt="" />
    </div>

    <!-- List -->
    <ng-container *ngIf="!(loading$ | async)">
      <div class="notif-dropdown__empty" *ngIf="(notifications$ | async)?.length === 0">
        <i class="fas fa-bell-slash"></i>
        <span>Aucune notification</span>
      </div>

      <ul class="notif-list" *ngIf="(notifications$ | async)?.length">
        <li
          *ngFor="let n of notifications$ | async"
          class="notif-item"
          [class.notif-item--unread]="!n.is_read"
          (click)="markRead(n)"
        >
          <div class="notif-item__icon" [ngClass]="colorFor(n.type)">
            <i class="fas {{ iconFor(n.type) }}"></i>
          </div>
          <div class="notif-item__body">
            <p class="notif-item__title">{{ n.title }}</p>
            <p class="notif-item__msg">{{ n.message }}</p>
            <span class="notif-item__time">{{ timeAgo(n.created_at) }}</span>
          </div>
          <span class="notif-item__dot" *ngIf="!n.is_read"></span>
        </li>
      </ul>
    </ng-container>
  </div>
</div>
