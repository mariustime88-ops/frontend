# departements.crud.yaml
name: Départements
resourceName: departements
model:
  - name: id
    type: number
    required: true
  - name: nom
    type: string
    required: true
  - name: code
    type: string
    required: true
  - name: population
    type: number
    required: false
  - name: superficie
    type: number
    required: false
  - name: chef_lieu
    type: string
    required: true
  - name: actif
    type: boolean
    required: true
  - name: date_creation
    type: Date
    required: true

columns:
  - field: nom
    header: Nom du département
    filterType: text
    style: { min-width: 15rem }
  - field: code
    header: Code
    filterType: text
    style: { min-width: 10rem }
  - field: chef_lieu
    header: Chef-lieu
    filterType: text
    style: { min-width: 12rem }
  - field: population
    header: Population
    filterType: numeric
    style: { min-width: 10rem }
  - field: superficie
    header: Superficie (km²)
    filterType: numeric
    style: { min-width: 12rem }
  - field: actif
    header: Statut
    filterType: boolean
    style: { min-width: 8rem }
  - field: date_creation
    header: Date de création
    filterType: date
    style: { min-width: 12rem }

formFields:
  - name: nom
    label: Nom du département
    type: text
    placeholder: Ex: Atlantique
    required: true
  - name: code
    label: Code département
    type: text
    placeholder: Ex: ATL
    required: true
  - name: chef_lieu
    label: Chef-lieu
    type: text
    placeholder: Ex: Ouidah
    required: true
  - name: population
    label: Population
    type: number
    placeholder: Nombre d'habitants
    required: false
  - name: superficie
    label: Superficie (km²)
    type: number
    placeholder: Superficie en kilomètres carrés
    required: false
  - name: actif
    label: Département actif
    type: boolean
    required: true
  - name: date_creation
    label: Date de création
    type: date
    required: true

filters:
  - nom
  - code
  - chef_lieu
  - actif
